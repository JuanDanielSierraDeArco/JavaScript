<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="16x16" href="./nuevo_curso_2025/img/favicon-16x16.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca tu tesoro</title>

    <!-- Fuente elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c2c2c, #4b4a4a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .contenedor {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 18px;
            text-align: center;
            max-width: 520px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #f5f7fa;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        p {
            color: #e4e6eb;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
        }

        .icono {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #b0b3b8;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="icono">✨</div>
        <h1>Hay que seguir buscando tu tesoro</h1>
        <p id="resultado"></p>
        <footer>Confía en el proceso</footer>
        <button id="hablar">Hablar</button>
    </div>

    <script>
        function buscarTesoro(loBusca) {
            if (loBusca === true) {
                return `🔍 Si lo buscas con dedicación y constancia,
                acabarás encontrando tu tesoro.
                No te rindas.`;
            } else {
                return `🌱 Si hoy no lo buscas, está bien.
                Lo importante es seguir intentándolo
                y no perder la motivación.`;
            }
        }

        // true = lo buscas | false = no lo buscas
        let mensaje = buscarTesoro(true);
        document.getElementById("resultado").textContent = mensaje;

        let texto = "Si buscas tu tesoro con dedicación y constancia,acabarás encontrando tu tesoro. No te rindas.";
        const hablar = (texto) => speechSynthesis.speak(new SpeechSynthesisUtterance(texto));

        document.getElementById('hablar').addEventListener('click', () => {
          hablar(texto);
        });
    </script>

</body>
</html>
